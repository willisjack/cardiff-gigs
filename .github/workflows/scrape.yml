name: Scrape Cardiff Gigs

on:
  schedule:
    
    - cron: '3 4 * * *'
    - cron: '3 7 * * *'
    - cron: '3 10 * * *'
    - cron: '3 14 * * *'
    - cron: '3 19 * * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue name to scrape (leave blank to scrape all)'
        required: false
        default: ''

concurrency:
  group: update-events
  cancel-in-progress: false


permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04   # was: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Probe Clwb
        run: |
          curl -sS -o /dev/null -w "sitemap: %{http_code}\n" https://clwb.net/tm-events-sitemap.xml
          curl -sS -o /dev/null -w "whats-on: %{http_code}\n" -A "Mozilla/5.0" https://clwb.net/whats-on/

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: |
          if [ -n "${{ inputs.venue }}" ]; then
            node scrape.js --venue "${{ inputs.venue }}"
          else
            SCRAPE_NO_ENRICH=1 node scrape.js --venue Clwb --venue Globe --venue Fuel
          fi

      - name: Show status.json
        run: |
          echo "--- summary / totals / alerts ---"
          node -e '
            const s=require("./status.json");
            console.log("generatedAt:",s.generatedAt);
            console.log("run:",JSON.stringify(s.run));
            console.log("totals:",JSON.stringify(s.totals));
            console.log("summary:",JSON.stringify(s.summary));
            console.log("alerts:",JSON.stringify(s.alerts,null,1));
            console.log("--- venue rows (problems first) ---");
            for(const v of s.venues) console.log(
              String(v.status).padEnd(9), String(v.venue).padEnd(26),
              "ret="+String(v.eventsReturned).padStart(3),
              "prev="+String(v.previousCount).padStart(3),
              "now="+String(v.currentCount).padStart(3),
              "chg="+String(v.change).padStart(4),
              v.dataFrom, v.error?("| "+v.error):"");
          '
