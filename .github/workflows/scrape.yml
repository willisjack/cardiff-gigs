name: Scrape Cardiff Gigs

on:
  schedule:
    
    - cron: '3 4 * * *'
    - cron: '3 7 * * *'
    - cron: '3 10 * * *'
    - cron: '3 14 * * *'
    - cron: '3 19 * * *'
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue name to scrape (leave blank to scrape all)'
        required: false
        default: ''

concurrency:
  group: update-events
  cancel-in-progress: false


permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04   # was: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Probe Clwb
        run: |
          curl -sS -o /dev/null -w "sitemap: %{http_code}\n" https://clwb.net/tm-events-sitemap.xml
          curl -sS -o /dev/null -w "whats-on: %{http_code}\n" -A "Mozilla/5.0" https://clwb.net/whats-on/

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run scraper
        run: |
          if [ -n "${{ inputs.venue }}" ]; then
            node scrape.js --venue "${{ inputs.venue }}"
          else
            node scrape.js --venue Clwb
          fi

      - name: Clwb rows after run
        run: |
          node -e '
            const ev=require("./events.json");
            const l=Array.isArray(ev)?ev:(ev.events||[]);
            const c=l.filter(e=>/clwb/i.test(e.venue||""));
            console.log("clwb rows:",c.length);
            console.log("undated:",c.filter(e=>!e.date||!String(e.date).trim()).length);
            console.log(JSON.stringify(c.slice(0,4).map(e=>({t:e.title,d:e.date,det:e.details})),null,1));
          '
