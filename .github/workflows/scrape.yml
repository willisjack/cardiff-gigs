name: Scrape Cardiff Gigs

on:
  workflow_dispatch:
    inputs:
      venue:
        description: 'Venue name to scrape (leave blank to scrape all)'
        required: false
        default: ''

concurrency:
  group: clwb-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: UA comparison probe
        run: node tools/clwb-probe3.js
        continue-on-error: true

      - name: Alternate-source probe
        run: node tools/clwb-probe2.js
        continue-on-error: true

      - name: Real scraper, Clwb only
        env:
          SCRAPE_NO_ENRICH: '1'
        run: node scrape.js --venue Clwb
        continue-on-error: true

      - name: Clwb rows in events.json after run
        run: |
          node -e '
            const ev=require("./events.json");
            const l=Array.isArray(ev)?ev:(ev.events||[]);
            const c=l.filter(e=>/clwb/i.test(e.venue||""));
            console.log("clwb events:",c.length);
            const last=c.map(e=>e.scrapedAt||"").filter(Boolean).sort().pop();
            console.log("newest scrapedAt:",last);
            console.log(JSON.stringify(c.slice(0,5).map(e=>({t:e.title,d:e.date,u:e.url})),null,1));
          '
